<!--
  Source for the App Store screenshots, in the look of the Shipaton artwork and
  the link preview (site/assets/og-source/final.html): cream ground, a serif
  headline, the real app in a phone, one shape behind it.

  The slide is picked by the URL hash, e.g. screenshot.html#01-runway.
  render.sh renders every slide at 1320x2868 (6.9-inch) into docs/screenshots.
  App screens come from site/assets/device, the bare captures the screenshot
  test writes. Fonts come from site/assets/fonts, so the render needs no network.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("../../site/assets/fonts/newsreader-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../../site/assets/fonts/jetbrains-mono.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        src: url("../../site/assets/fonts/inter.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1320px;
        height: 2868px;
        margin: 0;
      }
      body {
        position: relative;
        overflow: hidden;
        background: #f2efe7;
        color: #08142b;
      }
      h1 {
        position: absolute;
        left: 104px;
        top: 190px;
        width: 1110px;
        margin: 0;
        font-family: "Newsreader", Georgia, serif;
        font-size: 136px;
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      p {
        position: absolute;
        left: 108px;
        top: 500px;
        width: 1120px;
        margin: 0;
        color: #536279;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 50px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      /* The landing hero's right column, below the headline: violet field,
         mint blob and yellow shard, with the same values as site/assets/landing.css. */
      .field {
        position: absolute;
        left: 0;
        top: 720px;
        width: 1320px;
        height: 2148px;
        overflow: hidden;
        background: #6327d4;
        isolation: isolate;
      }
      .blob {
        position: absolute;
        z-index: -2;
        inset: 13% -24% auto -11%;
        height: 72%;
        border-radius: 52% 35% 47% 41%;
        background: #8fddaa;
        transform: rotate(-8deg);
      }
      .shard {
        position: absolute;
        z-index: -1;
        right: -120px;
        bottom: -160px;
        width: 760px;
        height: 760px;
        background: #f4d84b;
        clip-path: polygon(0 48%, 100% 0, 77% 100%);
      }
      .card {
        position: absolute;
        right: 70px;
        top: 1640px;
        display: grid;
        gap: 14px;
        width: 600px;
        padding: 44px 48px;
        border-radius: 36px;
        color: #08142b;
        background: #f8f7f2;
        box-shadow: 0 60px 140px rgba(3, 7, 22, 0.34);
        transform: rotate(5deg);
      }
      .card[hidden] {
        display: none;
      }
      .card span {
        color: #657087;
        font: 30px "JetBrains Mono", monospace;
        letter-spacing: 0.12em;
      }
      .card strong {
        font: 800 150px/1 "JetBrains Mono", monospace;
        letter-spacing: -0.08em;
      }
      .card small {
        color: #657087;
        font: 32px "Inter", system-ui, sans-serif;
      }
      .phone {
        position: absolute;
        left: 50%;
        top: 800px;
        width: 930px;
        transform: translateX(-50%) rotate(-4deg);
        padding: 22px;
        border-radius: 132px;
        background: #0b1424;
        border: 3px solid rgba(255, 255, 255, 0.13);
        box-shadow: 0 60px 120px rgba(3, 7, 22, 0.34);
      }
      /* The app is dark by design; a store thumbnail needs it lifted to read. */
      .phone img {
        display: block;
        width: 100%;
        border-radius: 112px;
        filter: brightness(1.3) contrast(1.15) saturate(1.15);
      }
      .island {
        position: absolute;
        left: 50%;
        top: 52px;
        width: 250px;
        height: 72px;
        transform: translateX(-50%);
        border-radius: 40px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="field"><div class="blob"></div><div class="shard"></div></div>
    <h1></h1>
    <p></p>
    <div class="phone"><img alt="" /><span class="island"></span></div>
    <div class="card" hidden><span>YOUR RUNWAY</span><strong>12 mo</strong><small>Running out September 2027</small></div>
    <script>
      const slides = {
        "01-runway": ["How long will your money last?", "One number, counted from today. No account, no bank login.", true],
        "02-living": ["Know what you can spend today", "What is left this month, and what that is per day.", false],
        "03-log": ["Log a spend in seconds", "Pick the occasion, type the amount.", false],
        "04-plan": ["Try a change before you make it", "See how many months a lower cost buys.", false],
      };
      const name = location.hash.slice(1) || "01-runway";
      const [title, line, card] = slides[name];
      document.querySelector("h1").textContent = title;
      document.querySelector("p").textContent = line;
      document.querySelector(".card").hidden = !card;
      document.querySelector(".phone img").src = `../../site/assets/device/${name}.png`;
    </script>
  </body>
</html>
