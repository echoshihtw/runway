<style>
  html,
  body {
    margin: 0;
    background: #000;
  }
  iframe {
    border: 0;
    display: block;
  }
</style>
<script>
  const w = +(new URLSearchParams(location.search).get("w") || 1800);
  document.write('<iframe src="/" scrolling="no" onload="f(this)" style="width:' + w + 'px;height:900px"></iframe>');
  function f(fr) {
    const d = fr.contentDocument,
      s = d.createElement("style");
    s.textContent = "*,*::before,*::after{animation:none!important;transition:none!important}";
    d.head.appendChild(s);
    const wr = d.querySelector(".wrap").getBoundingClientRect();
    const hero = d.querySelector(".hero").getBoundingClientRect();
    document.title =
      "wrap " +
      Math.round(wr.left) +
      ".." +
      Math.round(wr.right) +
      "  hero " +
      Math.round(hero.left) +
      ".." +
      Math.round(hero.right);
  }
</script>
