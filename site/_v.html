<style>
  html,
  body {
    margin: 0;
    background: #000;
  }
  iframe {
    width: 390px;
    height: 844px;
    border: 0;
    display: block;
  }
</style>
<iframe id="f" src="/" onload="go(this)"></iframe>
<script>
  function go(f) {
    const d = f.contentDocument,
      s = d.createElement("style");
    s.textContent = "*,*::before,*::after{animation:none!important;transition:none!important}";
    d.head.appendChild(s);
    d.documentElement.style.scrollBehavior = "auto";
    const p = new URLSearchParams(location.search);
    const el = d.querySelector(p.get("sel") || ".stories");
    d.scrollingElement.scrollTop = el.getBoundingClientRect().top + d.scrollingElement.scrollTop + +(p.get("off") || 0);
  }
</script>
