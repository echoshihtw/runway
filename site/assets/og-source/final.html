<!--
  Source for site/assets/og.jpg, the Open Graph card every shared link shows
  (referenced by site/index.html as og:image).

  To regenerate, render this file at exactly 1200x630 and encode it:

    chrome --headless --disable-gpu --window-size=1200,630 \
           --screenshot=og.png --default-background-color=00000000 \
           file://$PWD/site/assets/og-source/final.html

    sharp og.png --jpeg-quality 85 --jpeg-progressive \
                 --jpeg-chroma-subsampling 4:4:4 -o site/assets/og.jpg

  The shipped file is 1200x630, progressive, 4:4:4. Chroma subsampling matters
  here: the card is small mint type on a dark ground, and 4:2:0 fringes it.

  The fonts come from ../fonts, which ship with the site, so the render needs
  no network.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../fonts/inter.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        background: #f7f4ec;
      }
      img {
        display: block;
        width: 1119px;
        height: 630px;
      }
      a {
        position: absolute;
        left: 84px;
        bottom: 48px;
        display: inline-flex;
        align-items: center;
        min-height: 68px;
        padding: 0 36px;
        color: #08142b;
        background: #f28a6e;
        clip-path: polygon(1.5% 10%, 98.5% 0, 100% 85%, 3% 100%);
        font:
          700 24px/1 "Inter",
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .cta-mark {
        position: absolute;
        left: 371px;
        bottom: 106px;
        width: 14px;
        height: 14px;
        background: #08142b;
        clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
      }
    </style>
  </head>
  <body>
    <img src="../../../assets/marketing/runway-shipaton-thumbnail-light-cream-exact-newsreader.png" alt="" />
    <a href="#">See how it works&nbsp; →</a>
    <span class="cta-mark" aria-hidden="true"></span>
  </body>
</html>
