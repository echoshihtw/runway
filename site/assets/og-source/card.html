<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("../fonts/newsreader-500.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("../fonts/inter.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/jetbrains-mono.woff2") format("woff2");
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: #040d1a;
        color: #edf3fa;
        font-family: "Inter", system-ui, sans-serif;
        position: relative;
        overflow: hidden;
      }
      /* the landing page's own grid and glow */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(143, 221, 170, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(143, 221, 170, 0.075) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: linear-gradient(to bottom, black, transparent 78%);
      }
      .glow {
        position: absolute;
        width: 900px;
        height: 900px;
        right: -240px;
        top: -340px;
        background: radial-gradient(circle, rgba(143, 221, 170, 0.17), transparent 62%);
      }
      .wrap {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 392px;
        gap: 56px;
        align-items: center;
        padding: 64px 72px;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8fddaa;
        margin-bottom: 26px;
      }
      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 500;
        font-size: 74px;
        line-height: 1.04;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .lede {
        margin-top: 26px;
        font-size: 23px;
        line-height: 1.5;
        color: #9aa9bc;
        max-width: 30ch;
      }
      .foot {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .foot img {
        width: 38px;
        height: 38px;
        border-radius: 9px;
      }
      .url {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        color: #edf3fa;
      }
      .tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #456594;
        letter-spacing: 0.06em;
      }
      /* the phone, cropped to the one card that carries the idea */
      .phone {
        position: relative;
        width: 392px;
        height: 502px;
        border-radius: 38px;
        overflow: hidden;
        border: 1px solid #1d3a5e;
        background: #040d1a;
        box-shadow:
          0 34px 90px rgba(0, 0, 0, 0.6),
          0 0 0 8px rgba(6, 15, 30, 0.9);
      }
      .phone img {
        position: absolute;
        left: 0;
        top: -52px;
        width: 392px;
        display: block;
      }
      .fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 130px;
        background: linear-gradient(transparent, #040d1a);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="wrap">
      <div>
        <p class="eyebrow">One phone &middot; no account</p>
        <h1>How long will your money last?</h1>
        <p class="lede">One number, counted from today, and the month it runs out.</p>
        <div class="foot">
          <img src="../icon-180.png" alt="" />
          <div>
            <div class="url">echoshihtw.github.io/runway</div>
            <div class="tag">FINANCIAL RUNWAY &middot; iPHONE</div>
          </div>
        </div>
      </div>
      <div class="phone">
        <img src="../device/01-runway.png" alt="" />
        <div class="fade"></div>
      </div>
    </div>
  </body>
</html>
