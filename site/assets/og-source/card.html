<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("../fonts/newsreader-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter";
        src: url("../fonts/inter.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../fonts/jetbrains-mono.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #f2efe7;
        color: #08142b;
        font-family: "Inter", sans-serif;
      }
      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 54% 46%;
        align-items: center;
        gap: 0;
      }
      .copy {
        position: relative;
        z-index: 3;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 50px 58px;
        background: transparent;
      }
      .field {
        position: relative;
        align-self: stretch;
        overflow: hidden;
        background: #6327d4;
        clip-path: polygon(11% 0, 100% 0, 100% 100%, 0 100%, 7% 58%);
        margin-left: -72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 24px;
        color: #596379;
        font:
          15px/1 "JetBrains Mono",
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 13px;
      }
      h1 {
        max-width: 590px;
        margin: 0;
        font:
          500 96px/0.84 "Newsreader",
          Georgia,
          serif;
        letter-spacing: -0.055em;
        transform: rotate(-2deg);
        transform-origin: left center;
      }
      .question {
        max-width: 560px;
        margin: 25px 0 0;
        color: #49546a;
        font:
          24px/1.45 "Inter",
          sans-serif;
      }
      .details {
        margin-top: 28px;
        color: #244538;
        font:
          15px/1 "JetBrains Mono",
          monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .blob {
        position: absolute;
        width: 650px;
        height: 480px;
        left: -118px;
        top: 68px;
        border-radius: 52% 35% 47% 41%;
        background: #8fddaa;
        transform: rotate(-14deg);
      }
      .shard {
        position: absolute;
        right: -78px;
        bottom: -62px;
        width: 330px;
        height: 310px;
        background: #f4d84b;
        clip-path: polygon(0 48%, 100% 0, 77% 100%);
      }
      .star {
        position: absolute;
        left: 18px;
        top: 14px;
        width: 145px;
        height: 145px;
        background: #f08b72;
        clip-path: polygon(
          50% 0,
          61% 35%,
          96% 20%,
          72% 49%,
          100% 67%,
          63% 64%,
          59% 100%,
          44% 68%,
          11% 87%,
          29% 55%,
          0 39%,
          38% 39%
        );
        transform: rotate(-21deg);
      }
      .ribbon {
        position: absolute;
        z-index: 1;
        left: -12px;
        bottom: 40px;
        width: 305px;
        height: 88px;
        background: #f08b72;
        clip-path: polygon(0 48%, 24% 4%, 52% 34%, 79% 2%, 100% 42%, 76% 82%, 48% 59%, 20% 100%);
        transform: rotate(8deg);
      }
      .metric {
        position: absolute;
        z-index: 4;
        right: 18px;
        top: 42px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 13px 18px 11px;
        color: #08142b;
        background: #f4d84b;
        clip-path: polygon(3% 8%, 96% 0, 100% 86%, 5% 100%);
        font:
          16px/1 "JetBrains Mono",
          monospace;
        transform: rotate(6deg);
      }
      .metric strong {
        font-size: 34px;
        letter-spacing: -0.08em;
      }
      .phone {
        position: relative;
        z-index: 2;
        width: 380px;
        height: 535px;
        margin: 60px auto 0;
        overflow: hidden;
        border: 8px solid #020916;
        border-radius: 42px;
        background: #040d1a;
        box-shadow: 0 34px 90px rgba(3, 7, 22, 0.45);
        transform: rotate(-7deg);
      }
      .phone img {
        position: absolute;
        top: -48px;
        left: 0;
        width: 380px;
      }
      .fade {
        position: absolute;
        inset: auto 0 0;
        height: 116px;
        background: linear-gradient(transparent, rgba(4, 13, 26, 0.88));
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div class="brand"><img src="../icon-180.png" alt="" /> Private money planning</div>
        <h1>Financial<br />Runway</h1>
        <p class="question">How many months does your money cover?</p>
        <p class="details">One phone · no account · no bank connection</p>
      </section>
      <div class="field">
        <div class="blob"></div>
        <div class="shard"></div>
        <div class="star"></div>
        <div class="ribbon"></div>
        <div class="metric"><strong>12</strong> months</div>
        <div class="phone">
          <img src="../device/01-runway.png" alt="" />
          <div class="fade"></div>
        </div>
      </div>
    </main>
  </body>
</html>
