<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Newsreader;
        src: url("../fonts/newsreader-500.woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: Inter;
        src: url("../fonts/inter.woff2");
      }
      @font-face {
        font-family: JetBrains;
        src: url("../fonts/jetbrains-mono.woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }
      body {
        overflow: hidden;
        color: #08142b;
        background: #f2efe7;
        font-family: Inter, sans-serif;
      }
      main {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: absolute;
        z-index: 5;
        inset: 0 45% 0 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 52px 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 42px;
        color: #08142b;
        font:
          700 14px/1 Inter,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brand b {
        color: #2f8b56;
      }
      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 13px;
      }
      h1 {
        max-width: 520px;
        margin: 0;
        font:
          500 82px/0.9 Newsreader,
          Georgia,
          serif;
        letter-spacing: -0.06em;
      }
      .question {
        max-width: 480px;
        margin: 30px 0 0;
        color: #49546a;
        font-size: 21px;
        line-height: 1.48;
      }
      .details {
        margin: 33px 0 0;
        color: #244538;
        font:
          13px/1 JetBrains,
          monospace;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .field {
        position: absolute;
        inset: 0 0 0 55%;
        overflow: hidden;
        background: #6327d4;
      }
      .blob {
        position: absolute;
        left: -155px;
        top: 70px;
        width: 670px;
        height: 500px;
        border-radius: 52% 35% 47% 41%;
        background: #8fddaa;
        transform: rotate(-8deg);
      }
      .shard {
        position: absolute;
        right: -80px;
        bottom: -78px;
        width: 330px;
        height: 300px;
        background: #f4d84b;
        clip-path: polygon(0 48%, 100% 0, 77% 100%);
      }
      .metric {
        position: absolute;
        z-index: 4;
        right: 19px;
        top: 208px;
        width: 176px;
        padding: 16px 17px 15px;
        color: #08142b;
        background: #f8f7f2;
        border-radius: 13px;
        box-shadow: 0 20px 45px rgba(3, 7, 22, 0.28);
        transform: rotate(5deg);
      }
      .metric span {
        display: block;
        color: #657087;
        font:
          10px/1 JetBrains,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .metric strong {
        display: block;
        margin: 7px 0 4px;
        font:
          700 44px/0.9 JetBrains,
          monospace;
        letter-spacing: -0.08em;
      }
      .metric small {
        color: #657087;
        font-size: 9px;
      }
      .phone {
        position: absolute;
        z-index: 3;
        left: 42px;
        top: 72px;
        width: 310px;
        height: 482px;
        overflow: hidden;
        border: 8px solid #020916;
        border-radius: 37px;
        background: #040d1a;
        box-shadow: 0 34px 90px rgba(3, 7, 22, 0.45);
        transform: rotate(-4deg);
      }
      .phone img {
        position: absolute;
        top: -34px;
        left: 0;
        width: 310px;
      }
      .fade {
        position: absolute;
        inset: auto 0 0;
        height: 86px;
        background: linear-gradient(transparent, rgba(4, 13, 26, 0.82));
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div class="brand"><img src="../icon-180.png" alt="" /> Financial <b>Runway</b></div>
        <h1>How long will your money last?</h1>
        <p class="question">One number, counted from today, and the month it runs out.</p>
        <p class="details">Private · on device · iPhone</p>
      </section>
      <section class="field">
        <div class="blob"></div>
        <div class="shard"></div>
        <div class="metric">
          <span>Your runway</span><strong>12 mo</strong><small>Running out September 2027</small>
        </div>
        <div class="phone">
          <img src="../device/01-runway.png" alt="" />
          <div class="fade"></div>
        </div>
      </section>
    </main>
  </body>
</html>
