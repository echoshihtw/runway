name: Release PR

# Keeps one staging -> main pull request open and up to date, so a release is
# a single click: test staging, then merge this PR.
#
# The title carries the version release.yml will cut, using the same rules as
# semantic-release's default analyzer: BREAKING CHANGE -> major, feat -> minor,
# fix or perf -> patch. With no tag yet, the first release is v1.0.0.
#
# Nothing merges on its own. Needs "Allow GitHub Actions to create and approve
# pull requests" on in the repository's Actions settings.
#
# A pull request opened with GITHUB_TOKEN does not trigger ci.yml's
# pull_request run. ci.yml also runs on push to staging, on the same commit this
# PR points at, so its result still shows as a check here.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all branches and tags

      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          range=origin/main..origin/staging
          if [ -z "$(git log --no-merges --format='%s' "$range")" ]; then
            echo "staging has nothing new for main."
            exit 0
          fi

          # semantic-release reads every commit since the last tag, or all of
          # history before the first one.
          last=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || true)
          if [ -n "$last" ]; then
            analyzed="$last..origin/staging"
          else
            analyzed=origin/staging
          fi
          subjects=$(git log --no-merges --format='%s' "$analyzed")

          if git log --no-merges --format='%B' "$analyzed" | grep -q 'BREAKING CHANGE'; then
            bump=major
          elif grep -Eq '^feat(\(.+\))?:' <<< "$subjects"; then
            bump=minor
          elif grep -Eq '^(fix|perf)(\(.+\))?:' <<< "$subjects"; then
            bump=patch
          else
            bump=""
          fi

          if [ -z "$bump" ]; then
            version=""
          elif [ -z "$last" ]; then
            version="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$bump" in
              major) version="v$((major + 1)).0.0" ;;
              minor) version="v$major.$((minor + 1)).0" ;;
              patch) version="v$major.$minor.$((patch + 1))" ;;
            esac
          fi

          if [ -n "$version" ]; then
            title="chore(release): $version"
          else
            title="chore(release): sync staging to main, no new version"
          fi

          {
            echo "Merges \`staging\` into \`main\`. Last release: ${last:-none}."
            if [ -z "$version" ]; then
              echo
              echo "No commit here is a feat, fix or perf change, so merging cuts no new version."
            else
              echo
              echo "Merging releases $version to TestFlight and the Play Store internal track."
            fi
            echo
            echo "## Commits"
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            echo "## Before merging"
            echo "- Test the build from staging."
            echo "- Use **Create a merge commit**. Never squash: release.yml refuses it."
          } > body.md

          pr=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file body.md
          else
            gh pr create --base main --head staging --title "$title" --body-file body.md --label release
          fi
