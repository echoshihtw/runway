name: CI

# Runs on pull requests, on every push to staging, and from release.yml for the
# merge commit on main. The staging push is also what gives the release PR its
# checks: GitHub skips pull_request runs on PRs opened by GITHUB_TOKEN.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:

jobs:
  # ============================================================
  # QUALITY — every run
  # ============================================================
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Flutter version
        # One pin for every workflow and for local fvm: .fvmrc.
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Dart pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      # The package list and the strictness live in the Makefile, so local
      # runs and CI cannot drift apart. CI has its own flutter, not fvm.
      - name: Analyze
        run: make analyze FVM=flutter

      - name: Test
        run: make test FVM=flutter TEST_FLAGS=--reporter=github

  # ============================================================
  # BUILD iOS: the release on main, before the tag is cut
  # ============================================================
  # cd.yml builds the IPA only after the tag exists, so this catches a broken
  # native build while there is still nothing to roll back.
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the Flutter version
        # One pin for every workflow and for local fvm: .fvmrc.
        run: echo "FLUTTER_VERSION=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        run: cd app/ios && pod install

      - name: Build iOS (no codesign)
        run: |
          cd app && flutter build ios \
            --release \
            --no-codesign \
            --dart-define=FLUTTER_BUILD_NUMBER=${{ github.run_number }}
