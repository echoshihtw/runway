name: CI

# Runs on pull requests, on every push to staging, and from release.yml for the
# merge commit on main. The staging push is also what gives the release PR its
# checks: GitHub skips pull_request runs on PRs opened by GITHUB_TOKEN.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # QUALITY — every run
  # ============================================================
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Dart pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Analyze — domain
        run: cd packages/domain && dart analyze --fatal-infos

      - name: Analyze — data
        run: cd packages/data && flutter analyze --fatal-infos

      - name: Analyze — application
        run: cd packages/application && flutter analyze --fatal-infos

      - name: Analyze — design_system
        run: cd packages/design_system && flutter analyze --fatal-infos

      - name: Analyze — presentation
        run: cd packages/presentation && flutter analyze --fatal-infos

      - name: Analyze — app
        run: cd app && flutter analyze --fatal-infos

      - name: Test — domain
        # A zone with daylight saving. Date arithmetic that is wrong by an hour
        # is invisible in UTC, and four of the six shipped locales observe it.
        env:
          TZ: Europe/Paris
        run: cd packages/domain && dart test --reporter=github

      - name: Test — data
        run: cd packages/data && flutter test --reporter=github

      - name: Test — application
        run: cd packages/application && flutter test --reporter=github

      - name: Test — design_system
        run: cd packages/design_system && flutter test --reporter=github

      - name: Test — presentation
        run: cd packages/presentation && flutter test --reporter=github

      - name: Test — app
        run: cd app && flutter test --reporter=github

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/domain/test-results/

  # ============================================================
  # BUILD iOS — push to staging, and the release on main
  # ============================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: quality
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        run: cd app/ios && pod install

      - name: Build iOS (no codesign)
        run: |
          cd app && flutter build ios \
            --release \
            --no-codesign \
            --dart-define=FLUTTER_BUILD_NUMBER=${{ github.run_number }}

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 7

  # ============================================================
  # BUILD Android — push to staging, and the release on main
  # ============================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Build Android APK
        run: |
          cd app && flutter build apk \
            --release \
            --dart-define=FLUTTER_BUILD_NUMBER=${{ github.run_number }}

      - name: Build Android AAB
        run: |
          cd app && flutter build appbundle \
            --release \
            --dart-define=FLUTTER_BUILD_NUMBER=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
