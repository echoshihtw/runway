name: CD

# Deploys an existing release tag. release.yml calls it after cutting a tag;
# run it by hand from the Actions tab to redeploy one.
#
# No "push: tags" trigger: tags cut by release.yml use GITHUB_TOKEN, which never
# starts another workflow. The build number is the commit count, so it only
# grows along main.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, such as v1.0.0
        type: string
        required: true

env:
  TAG: ${{ inputs.tag }}
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # RELEASE iOS — TestFlight
  # ============================================================
  release-ios:
    name: Release iOS → TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the build number counts commits

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod install
        run: cd app/ios && pod install

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Import provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/pp.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # The release tag is the version. release.yml passes the tag that
      # semantic-release cut from the merge to main, so merging the release PR
      # is what decides what ships and no version can appear without one.
      # pubspec's value is the default for local builds only, so an archive
      # built by hand for submission must pass BUILD_NAME to match (#99).
      - name: Build iOS IPA
        run: |
          cd app && flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name="${TAG#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # altool takes no path for the key: it searches ./private_keys,
          # ~/private_keys, ~/.private_keys and ~/.appstoreconnect/private_keys,
          # and the file must be named AuthKey_<KEYID>.p8. Writing it anywhere
          # else decodes a valid secret that altool then cannot find.
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          xcrun altool --upload-app \
            --type ios \
            --file app/build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.tag }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 30

  # ============================================================
  # RELEASE Android → Play Store
  # ============================================================
  # Turned off until the Google Play release (#56). None of the Android
  # secrets are set, so the job would fail on every iOS release. CI still
  # builds Android on pushes to staging. Remove this `if` to turn it back on.
  release-android:
    name: Release Android → Play Store
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the build number counts commits

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Code generation
        run: melos run gen

      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/keystore.jks
          # build.gradle.kts only enables release signing when this file exists;
          # storeFile is resolved relative to the app module (app/android/app).
          cat > app/android/key.properties <<EOF
          storeFile=keystore.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

      - name: Build Android AAB
        run: |
          cd app && flutter build appbundle \
            --release \
            --build-name="${TAG#v}" \
            --build-number="$(git rev-list --count HEAD)"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.survival.app
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.tag }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
