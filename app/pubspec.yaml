name: app
description: Runway app entry point
publish_to: none
resolution: workspace
version: 1.0.1+2

environment:
  sdk: "^3.11.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  presentation:
    path: ../packages/presentation
  application:
    path: ../packages/application
  data:
    path: ../packages/data
  domain:
    path: ../packages/domain
  design_system:
    path: ../packages/design_system
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  share_plus: ^12.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  sqlcipher_flutter_libs: ^0.6.0
  flutter_windowmanager_plus: ^1.0.1
  purchases_flutter: ^10.0.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  drift: ^2.26.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/runway-icon-1024.png
